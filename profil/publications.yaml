# --- Mémoire ---

- id: pub-memoire
  type: memoire
  annee: 2026
  auteurs: Cadieux
  rang_auteur: 1
  titre: "Opérationnaliser le potentiel de croissance des partis politiques dans un contexte multipartite : application aux élections canadiennes de 2011 à 2021"
  lieu: Université Laval
  lien: https://corpus.ulaval.ca/entities/publication/6f3a9224-6dc2-437a-83ee-0bfdd338a5b1
  code: "~/code/memoire_pot_growth (reproductible ; package R potgrowth sur GitHub hubcad25/potgrowth)"
  resume: "Mémoire par articles. Article 1 : cinq indicateurs de propension au vote, validation de leur convergence vers une dimension latente commune, transformation en courbes de probabilité calibrées sur quatre élections fédérales canadiennes (2011-2021, données CES). Article 2 : simulations Monte Carlo de scénarios électoraux ; le potentiel est défini comme le 97,5e percentile des distributions, validé par calibration empirique et validation nomologique sur la vague orange du NPD en 2011. Cadre de validité conceptuelle d'Adcock et Collier (2001)."
  methodes: [analyse factorielle, calibration de probabilités, simulation Monte Carlo, validation de mesure]
  formation: form-maitrise-ulaval
  facettes: [politique, recherche, sondages]
  poids: fort
  validation: valide


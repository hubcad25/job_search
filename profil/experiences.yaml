- id: exp-vdq-stage
  titre: Stagiaire en analyse de données sociales
  organisation: Ville de Québec
  unite: "Service de l'interaction citoyenne, division Innovation et développement de la relation citoyenne"
  type: stage
  periode: {debut: 2026-05, fin: 2026-09}
  regime: temps_plein
  heures_semaine: 25-35
  remunere: oui
  au_nom: employeur
  role: responsable  # a conçu et construit la base de l'outil
  contacts:
    - "Camille Tremblay-Antoine (superviseure)"
    - "Mathieu Grégoire (directeur de division)"
  realisations:
    - "Mandat de départ peu défini : Hubert a cerné la solution (Azure AI Search) par sa propre recherche et en consultant d'autres divisions de la Ville, puis a présenté le projet aux TI, qui l'ont accepté. Preuve d'initiative et de collaboration."
    - "Conception et construction de la base d'un outil d'accès aux données de sondage : création de l'index Azure AI Search (par Hubert), migration des données dans l'index par scripts Python, application Shiny qui l'interroge."
    - "Classement par LLM (Azure OpenAI) des questions de sondage selon les produits et services municipaux (jeu de référence annoté, lots d'annotation, dictionnaire de produits)."
    - "Gestion du panel de répondants, appelé à passer dans Dynamics 365 : communication du besoin aux TI, structure et schémas de données (modélisation des tables et relations, dit par Hubert le 2026-10-28), prise en main de l'outil pour que l'équipe puisse l'utiliser elle-même."
    - "Conception du pipeline pour que les données de l'outil (index Azure AI Search) alimentent Power BI, l'outil de tableaux de bord de la Ville ; l'index est destiné aux tableaux de bord des différentes divisions."
  resultat: "Pas encore déployé dans les divisions, faute de temps pendant le stage ; le déploiement est prévu. La superviseure poursuit le développement pour l'étendre aux autres divisions et services."
  suite: "Mathieu Grégoire m'a invité à soumissionner comme consultant pour poursuivre le projet ; ça n'a pas abouti."
  facettes: [public, sondages, techno]
  competences: [comp-r-shiny, comp-azure, comp-python, comp-llm-annotation, comp-rag-recherche-semantique, comp-crm, comp-power-bi]
  projets: [proj-vdq-outil-sondages]
  attention: "Dynamics 365 : Hubert a défini le besoin et les schémas de données avec les TI ; ne pas dire qu'il a configuré ou développé dans Dynamics 365. Power BI : sortie du pipeline prévue pour Power BI, mais Hubert n'a jamais construit de tableau de bord Power BI ; ne pas l'affirmer."
  note_privee: "Hubert trouve que Power BI n'est pas le meilleur outil de tableaux de bord et en préfère d'autres. Ne pas l'écrire à un employeur qui utilise Power BI."
  montrable: captures
  poids: fort  # cloud (Azure) et LLM en contexte organisationnel professionnel
  validation: valide


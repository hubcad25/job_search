# Une compétence = un nom, deux niveaux et des preuves (ids d'entrées).
# niveau_sans_ia : ce qu'Hubert peut défendre en entrevue technique sans IA.
# niveau_avec_ia : ce qu'il livre avec Claude Code (rôle de PM ou d'architecte technique).
# Échelle : notions, debutant, intermediaire, avance, expert ; sans_objet si la distinction ne s'applique pas.
# Règle pour les agents : une compétence sans preuve ne s'affirme pas dans un CV ou une lettre.

